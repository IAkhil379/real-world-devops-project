apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app-deployment
  labels:
    app: devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
      - name: devops-app-container
        # The image name will be replaced by Jenkins during the pipeline run
        image: your-dockerhub-username/devops-app-image:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-app-service
spec:
  type: LoadBalancer # Exposes the service externally using a cloud load balancer
  ports:
  - port: 80
    targetPort: 5000
  selector:
    app: devops-app